server {
    server_name srv2.ouk.ac.ke www.srv2.ouk.ac.ke;

    root /var/www/srv2.ouk.ac.ke/frontend;
    index index.html index.php;

    access_log /var/log/nginx/srv2.ouk.ac.ke_access.log main;
    error_log  /var/log/nginx/srv2.ouk.ac.ke_error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Collapse any double /api/api prefix (harmless if frontend apiUrl is correct)
    location /api/api {
        rewrite ^/api/api(/.*)$ /api$1 break;
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub when frontend apiUrl includes /api (legacy bundle): /api/userHub -> /userHub
    location /api/userHub {
        rewrite ^/api/userHub(/.*)?$ /userHub$1 break;
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SignalR hub (frontend connects to /userHub)
    location /userHub {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # DMS Export Manager — Axiom document sync companion app
    location /dms-export/ {
        root /var/www/srv2.ouk.ac.ke;
        index index.php;
        try_files $uri $uri/ =404;

        location ~ ^/dms-export/(storage/|config\.php) {
            deny all;
            return 404;
        }

        location ~ ^/dms-export/.+\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # PHP (for future apps)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all; access_log off; log_not_found off;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    listen 443 ssl; # managed by Certbot
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/srv2.ouk.ac.ke/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/srv2.ouk.ac.ke/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    include /etc/nginx/includes/monitoring_locations.conf;
}
server {
    if ($host = srv2.ouk.ac.ke) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name srv2.ouk.ac.ke www.srv2.ouk.ac.ke;
    return 404; # managed by Certbot


    include /etc/nginx/includes/monitoring_locations.conf;
}
